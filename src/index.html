<!doctype html>
<html lang="uk">
<head>

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/unbounded.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/onest.woff2" as="font" type="font/woff2" crossorigin>

      font-family: 'Unbounded';

  <!-- Анімації появи вмикаються лише з JS і без prefers-reduced-motion: без цього контент видно одразу -->
  <script>
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion');
  </script>
